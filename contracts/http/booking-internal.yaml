{
  "openapi": "3.1.1",
  "info": {
    "title": "Booklane internal queries",
    "version": "1.0.0",
    "description": "Solo lectura y control demo. HTTP Basic técnico antes del principal propagado; api elimina cabeceras del navegador. No existe ruta de confirmación interna. Operaciones siempre propias incluso ADMIN."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "paths": {
    "/internal/v1/resources": {
      "get": {
        "operationId": "internalresources",
        "summary": "resources",
        "security": [
          {
            "technicalBasic": []
          }
        ],
        "responses": {
          "200": {
            "description": "Catálogo demo común",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ResourcePage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/INVALID_REQUEST"
          },
          "401": {
            "$ref": "#/components/responses/AUTHENTICATION_REQUIRED"
          },
          "403": {
            "$ref": "#/components/responses/FORBIDDEN"
          },
          "413": {
            "$ref": "#/components/responses/PAYLOAD_TOO_LARGE"
          },
          "503": {
            "$ref": "#/components/responses/SERVICE_UNAVAILABLE"
          }
        },
        "parameters": [
          {
            "name": "type",
            "in": "query",
            "required": false,
            "schema": {
              "enum": [
                "ROOM",
                "EQUIPMENT"
              ]
            }
          },
          {
            "name": "q",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 0,
              "maxLength": 100
            }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "name": "size",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "sort",
            "in": "query",
            "required": false,
            "schema": {
              "enum": [
                "name,asc"
              ],
              "default": "name,asc"
            }
          },
          {
            "name": "X-Actor-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            },
            "description": "Generado por api; debe existir en catálogo común"
          },
          {
            "name": "X-Actor-Role",
            "in": "header",
            "required": true,
            "schema": {
              "enum": [
                "USER",
                "ADMIN"
              ]
            },
            "description": "Debe coincidir con catálogo"
          }
        ]
      }
    },
    "/internal/v1/resources/{id}/availability": {
      "get": {
        "operationId": "internalavailability",
        "summary": "availability",
        "security": [
          {
            "technicalBasic": []
          }
        ],
        "responses": {
          "200": {
            "description": "Snapshot consistente; intervalos anónimos",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Availability"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/INVALID_REQUEST"
          },
          "401": {
            "$ref": "#/components/responses/AUTHENTICATION_REQUIRED"
          },
          "403": {
            "$ref": "#/components/responses/FORBIDDEN"
          },
          "404": {
            "$ref": "#/components/responses/NOT_FOUND"
          },
          "413": {
            "$ref": "#/components/responses/PAYLOAD_TOO_LARGE"
          },
          "503": {
            "$ref": "#/components/responses/SERVICE_UNAVAILABLE"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            }
          },
          {
            "name": "from",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "to",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "X-Actor-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            },
            "description": "Generado por api; debe existir en catálogo común"
          },
          {
            "name": "X-Actor-Role",
            "in": "header",
            "required": true,
            "schema": {
              "enum": [
                "USER",
                "ADMIN"
              ]
            },
            "description": "Debe coincidir con catálogo"
          }
        ],
        "description": "from inclusivo/to exclusivo en Europe/Madrid; máximo 31 días. Anclas UTC en rejilla de 15 minutos. Sin títulos, actor o propietario ajenos."
      }
    },
    "/internal/v1/bookings/mine": {
      "get": {
        "operationId": "internalmyBookings",
        "summary": "myBookings",
        "security": [
          {
            "technicalBasic": []
          }
        ],
        "responses": {
          "200": {
            "description": "Reservas propias",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BookingPage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/INVALID_REQUEST"
          },
          "401": {
            "$ref": "#/components/responses/AUTHENTICATION_REQUIRED"
          },
          "403": {
            "$ref": "#/components/responses/FORBIDDEN"
          },
          "413": {
            "$ref": "#/components/responses/PAYLOAD_TOO_LARGE"
          },
          "503": {
            "$ref": "#/components/responses/SERVICE_UNAVAILABLE"
          }
        },
        "parameters": [
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "enum": [
                "CONFIRMED",
                "CANCELLED"
              ]
            }
          },
          {
            "name": "period",
            "in": "query",
            "required": false,
            "schema": {
              "enum": [
                "FUTURE",
                "PAST",
                "ALL"
              ],
              "default": "FUTURE"
            }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "name": "size",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "sort",
            "in": "query",
            "required": false,
            "schema": {
              "enum": [
                "startsAt,asc",
                "startsAt,desc"
              ],
              "default": "startsAt,asc"
            }
          },
          {
            "name": "X-Actor-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            },
            "description": "Generado por api; debe existir en catálogo común"
          },
          {
            "name": "X-Actor-Role",
            "in": "header",
            "required": true,
            "schema": {
              "enum": [
                "USER",
                "ADMIN"
              ]
            },
            "description": "Debe coincidir con catálogo"
          }
        ],
        "description": "FUTURE: startsAt > reloj del servidor; PAST: startsAt <= reloj; ALL sin filtro temporal. Orden termina en id con la misma dirección."
      }
    },
