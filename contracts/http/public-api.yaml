      "get": {
        "operationId": "session",
        "summary": "session",
        "security": [],
        "responses": {
          "200": {
            "description": "Estado actual; también anónimo. Prepara cookie XSRF-TOKEN.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Session"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/INVALID_REQUEST"
          },
          "401": {
            "$ref": "#/components/responses/AUTHENTICATION_REQUIRED"
          },
          "403": {
            "$ref": "#/components/responses/FORBIDDEN"
          },
          "413": {
            "$ref": "#/components/responses/PAYLOAD_TOO_LARGE"
          },
          "503": {
            "$ref": "#/components/responses/SERVICE_UNAVAILABLE"
          }
        }
      },
      "post": {
        "operationId": "login",
        "summary": "login",
        "security": [
          {
            "csrf": []
          }
        ],
        "responses": {
          "200": {
            "description": "Autenticado; renueva sesión. 401 genérico si falla.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Session"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/INVALID_REQUEST"
          },
          "401": {
            "$ref": "#/components/responses/AUTHENTICATION_REQUIRED"
          },
          "403": {
            "$ref": "#/components/responses/FORBIDDEN"
          },
          "413": {
            "$ref": "#/components/responses/PAYLOAD_TOO_LARGE"
          },
          "503": {
            "$ref": "#/components/responses/SERVICE_UNAVAILABLE"
          }
        },
        "requestBody": {
          "required": true,
          "description": "Máximo 16 KiB. Campos desconocidos se rechazan. Texto normalizado antes de validar longitud/publicar.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoginRequest"
              }
            }
          }
        }
      },
      "delete": {
        "operationId": "logout",
        "summary": "logout",
        "security": [
          {
            "session": [],
            "csrf": []
          }
        ],
        "responses": {
          "204": {
            "description": "Sesión invalidada y sus streams cerrados; renovar CSRF con GET /api/session."
          },
          "400": {
            "$ref": "#/components/responses/INVALID_REQUEST"
          },
          "401": {
            "$ref": "#/components/responses/AUTHENTICATION_REQUIRED"
          },
          "403": {
            "$ref": "#/components/responses/FORBIDDEN"
          },
          "413": {
            "$ref": "#/components/responses/PAYLOAD_TOO_LARGE"
          },
          "503": {
            "$ref": "#/components/responses/SERVICE_UNAVAILABLE"
          }
        }
      }
    },
    "/api/resources": {
      "get": {
        "operationId": "resources",
        "summary": "resources",
        "security": [
          {
            "session": []
          }
