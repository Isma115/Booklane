{
  "openapi": "3.1.1",
  "info": {
    "title": "Booklane public API",
    "version": "1.0.0",
    "description": "Contrato previo a endpoints. Cookies y CSRF de mismo origen; máximo JSON 16 KiB; UUID canónicos e instantes sin subsegundos. Páginas con desempate por id."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "paths": {
