    "/api/stream": {
      "get": {
        "operationId": "stream",
        "summary": "stream",
        "security": [
          {
            "session": []
          }
        ],
        "responses": {
          "200": {
            "description": "SSE filtrado; sin replay durable. Avisos disparan GET. Heartbeat cada 15 s; búfer 64 y máximo 3 conexiones/sesión; desbordamiento cierra el stream.",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                },
                "example": "event: heartbeat\ndata: {}\n\n"
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/INVALID_REQUEST"
          },
          "401": {
            "$ref": "#/components/responses/AUTHENTICATION_REQUIRED"
          },
          "403": {
            "$ref": "#/components/responses/FORBIDDEN"
          },
          "413": {
            "$ref": "#/components/responses/PAYLOAD_TOO_LARGE"
          },
          "429": {
            "$ref": "#/components/responses/STREAM_LIMIT"
          },
          "503": {
            "$ref": "#/components/responses/SERVICE_UNAVAILABLE"
          }
        },
        "description": "event operation.completed transporta CommandCompleted solo para su actor; availability.changed transporta AvailabilityChanged anónimo. Sesión cerrada cancela streams. Last-Event-ID no garantiza replay."
      }
    },
