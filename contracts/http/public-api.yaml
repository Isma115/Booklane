              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Availability"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/INVALID_REQUEST"
          },
          "401": {
            "$ref": "#/components/responses/AUTHENTICATION_REQUIRED"
          },
          "403": {
            "$ref": "#/components/responses/FORBIDDEN"
          },
          "404": {
            "$ref": "#/components/responses/NOT_FOUND"
          },
          "413": {
            "$ref": "#/components/responses/PAYLOAD_TOO_LARGE"
          },
          "503": {
            "$ref": "#/components/responses/SERVICE_UNAVAILABLE"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            }
          },
          {
            "name": "from",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "to",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "date"
            }
          }
        ],
        "description": "from inclusivo/to exclusivo en Europe/Madrid; máximo 31 días. Anclas UTC en rejilla de 15 minutos. Sin títulos, actor o propietario ajenos."
      }
    },
