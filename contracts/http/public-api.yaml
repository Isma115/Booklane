    "/api/resources/{id}/availability": {
      "get": {
        "operationId": "availability",
        "summary": "availability",
        "security": [
          {
            "session": []
          }
        ],
        "responses": {
          "200": {
            "description": "Snapshot consistente; intervalos anónimos",
