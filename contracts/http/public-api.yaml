              "enum": [
                "FUTURE",
                "PAST",
                "ALL"
              ],
              "default": "FUTURE"
            }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0,
