spring:
  datasource:
    url: "${booklane.database-url}"
    username: "${booklane.database-username}"
    password: "${booklane.database-password}"
  flyway:
    default-schema: booking
    schemas: booking
  application:
    name: booklane-booking
  main:
    web-application-type: servlet
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  address: 127.0.0.1
  port: 8082
booklane:
  users-file: "${BOOKLANE_USERS_FILE:}"
  database-url: "${BOOKLANE_DB_URL:}"
  database-username: booklane_booking
  database-password: "${BOOKLANE_DB_PASSWORD:}"
  internal-username: booklane-internal
  internal-password: "${BOOKLANE_INTERNAL_PASSWORD:}"
  kafka-bootstrap-servers: "${BOOKLANE_KAFKA_BOOTSTRAP_SERVERS:}"
  kafka-username: booklane-booking
  kafka-password: "${BOOKLANE_KAFKA_BOOKING_PASSWORD:}"
